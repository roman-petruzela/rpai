[package]
name = "rpai"
version = "0.1.0"
edition = "2021"
description = "Local personal AI assistant powered by Ollama"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
futures-util = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
